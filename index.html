<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal AI Agent</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --subtext-color: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            text-align: center;
        }

        .container {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 380px;
            width: 100%;
        }

        .icon {
            font-size: 52px;
            margin-bottom: 12px;
        }

        h2 {
            margin: 0 0 8px 0;
            font-size: 22px;
            color: #f8fafc;
        }

        p {
            color: var(--subtext-color);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .steps {
            background-color: #0f172a;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #334155;
            text-align: left;
            margin-bottom: 24px;
        }

        .step-item {
            font-size: 13px;
            color: #cbd5e1;
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            border: none;
            color: white;
            background-color: #16a34a;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #15803d;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">⚖️</div>
        <h2>Legal AI Agent</h2>
        <p>Lex.uz va Fuqarolik Kodeksi standartlari bo'yicha shartnomalarni tezkor tahlil qilish xizmati</p>

        <div class="steps">
            <div class="step-item">1️⃣ Pastdagi yashil tugmani bosing.</div>
            <div class="step-item">2️⃣ Chatga PDF yoki Word faylingizni yuklang.</div>
            <div class="step-item">3️⃣ AI Agent 10 soniyada Word (.docx) xulosasini yuboradi.</div>
        </div>

        <button class="btn" onclick="openChat()">💬 Chatga o'tish va fayl yuborish</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function openChat() {
            tg.close();
        }
    </script>
</body>
</html>
