<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal AI Agent - Shartnoma Ekspertizasi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --subtext-color: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            text-align: center;
        }

        .container {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        h2 {
            margin: 0 0 8px 0;
            font-size: 20px;
        }

        p {
            color: var(--subtext-color);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .btn {
            border: none;
            color: white;
            background-color: var(--accent-color);
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .instructions {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background-color: #0f172a;
            border-radius: 10px;
            border: 1px solid #334155;
        }

        .instructions.active {
            display: block;
        }

        .instruction-step {
            font-size: 13px;
            color: #cbd5e1;
            margin: 8px 0;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">⚖️</div>
        <h2>Legal AI Agent</h2>
        <p>Lex.uz va Fuqarolik Kodeksi asosida shartnomalarni tezkor tahlil qilish va Word (DOCX) hujjat olish</p>

        <div class="upload-btn-wrapper">
            <button class="btn" id="uploadBtn">📄 Shartnoma faylini tanlash</button>
            <input type="file" id="fileInput" accept=".pdf,.docx,.doc" onchange="handleFileSelect(event)" />
        </div>

        <div class="instructions" id="instructionBox">
            <p style="color: #38bdf8; font-weight: bold; margin-bottom: 8px;">✅ Fayl tanlandi!</p>
            <div class="instruction-step">1. Pastdagi tugmani bosing.</div>
            <div class="instruction-step">2. Chatga faylni <b>Document (Fayl)</b> shaklida yuboring.</div>
            <div class="instruction-step">3. AI Agent bir necha soniyada Word xulosasini tayyorlab beradi.</div>
            <br>
            <button class="btn" style="background-color: #16a34a;" onclick="openChat()">💬 Chatga o'tish va fayl yuborish</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('uploadBtn').innerText = "📁 " + file.name;
                document.getElementById('instructionBox').classList.add('active');
            }
        }

        function openChat() {
            // Mini App'ni yopadi va bot chatiga qaytaradi
            tg.close();
        }
    </script>
</body>
</html>
